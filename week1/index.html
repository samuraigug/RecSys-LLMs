<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Lunch Menu Generator</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'%3E%3Cpath d='M10 30h60a30 30 0 0 1-60 0' fill='%23ff6b6b'/%3E%3C/svg%3E">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            width: 90%;
            max-width: 500px;
            padding: 30px;
            text-align: center;
        }
        
        h1 {
            color: #ff6b6b;
            margin-bottom: 20px;
            font-size: 2.2rem;
        }
        
        .description {
            color: #555;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .lunch-display {
            background-color: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            margin: 25px 0;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }
        
        .food-icon {
            width: 80px;
            height: 80px;
            display: grid;
            place-items: center;
            margin-bottom: 15px;
            color: #ff6b6b;
        }

        .food-icon svg { width: 80px; height: 80px; }
        .ui-icon { width: 1em; height: 1em; vertical-align: -0.1em; }
        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 5px solid #ffd6d6;
            border-top-color: #ff6b6b;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .food-name {
            font-size: 2rem;
            color: #333;
            font-weight: bold;
            margin: 10px 0;
        }
        
        .generate-btn {
            background-color: #ff6b6b;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
        }
        
        .generate-btn:hover {
            background-color: #ff5252;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.5);
        }
        
        .generate-btn:active {
            transform: translateY(0);
        }

        .generate-btn:focus-visible {
            outline: 3px solid #803434;
            outline-offset: 4px;
        }
        
        .footer {
            margin-top: 30px;
            color: #777;
            font-size: 0.9rem;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }

        @media (prefers-reduced-motion: reduce) {
            .fade-in, .loading-spinner { animation: none; }
            .generate-btn, .lunch-display { transition: none; }
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .food-name {
                font-size: 1.6rem;
            }
            
            .generate-btn {
                padding: 12px 30px;
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Original, local SVG artwork. Each food symbol represents its menu label; BBQ uses a grill. -->

                <g fill="#ef6a65" stroke="#b94f47" stroke-width="2"><circle cx="23" cy="35" r="7"/><circle cx="56" cy="35" r="7"/></g>

                <path d="M18 38l8-8 8 6 9-11 9 9 9-2" fill="none" stroke="#e87061" stroke-width="7" stroke-linecap="round"/>
                <path d="M9 58Q14 28 43 28Q64 29 72 58Q41 75 9 58Z" fill="#f5c565" stroke="#a36a32" stroke-width="3"/>
                <g fill="#d99e41"><circle cx="25" cy="51" r="2"/><circle cx="38" cy="43" r="2"/><circle cx="51" cy="53" r="2"/><circle cx="37" cy="60" r="2"/><circle cx="61" cy="46" r="2"/></g>
            </symbol>
            <symbol id="food-ramen" viewBox="0 0 80 80">
                <path d="M22 11l43 22M28 6l43 22" stroke="#865d3e" stroke-width="3" stroke-linecap="round"/>
                <ellipse cx="39" cy="41" rx="29" ry="9" fill="#ead292" stroke="#8a5a45" stroke-width="3"/>

                <path d="M10 41q3 29 29 29t29-29q-28 15-58 0Z" fill="#ef7d76" stroke="#8a5a45" stroke-width="3"/>
                <path d="M35 24q-8 4 0 8t0 9m8-13q-7 4 0 9" fill="none" stroke="#d0ad58" stroke-width="3"/>
            </symbol>
            <symbol id="food-sandwich" viewBox="0 0 80 80">
                <path d="M12 27l52-9 7 39-48 12Z" fill="#d29555" stroke="#895630" stroke-width="3" stroke-linejoin="round"/>

            <symbol id="ui-utensils" viewBox="0 0 24 24"><path d="M3 2v5q0 3 4 3t4-3V2M7 2v20M20 2q-6 4-4 11h4m0-11v20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>

        </defs>
    </svg>
    <div class="container">
        <h1><svg class="ui-icon" aria-hidden="true"><use href="#ui-utensils"></use></svg> Random Lunch Generator</h1>
        <p class="description">Struggling to decide what to eat? Let us choose for you with just one click!</p>
        
        <div class="lunch-display" role="status" aria-live="polite" aria-atomic="true">
            <div class="food-icon" aria-hidden="true"></div>
            <div class="food-name">What's for lunch?</div>
        </div>
        
        <button class="generate-btn" id="generateBtn">
            <svg class="ui-icon" aria-hidden="true"><use href="#ui-shuffle"></use></svg> Generate Lunch!
        </button>
        
        <p class="footer">Click the button again if you can't decide!</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const generateBtn = document.getElementById('generateBtn');
            const foodIcon = document.querySelector('.food-icon');
            const foodName = document.querySelector('.food-name');
            const lunchDisplay = document.querySelector('.lunch-display');
            
            // Each unchanged menu entry maps to its own local, dish-specific SVG symbol.
            const lunchMenu = [
                { name: "Pizza", icon: "food-pizza" },
                { name: "Sushi", icon: "food-sushi" },
                { name: "Burger", icon: "food-burger" },
                { name: "Salad", icon: "food-salad" },
                { name: "Tacos", icon: "food-tacos" },
                { name: "Ramen", icon: "food-ramen" },
                { name: "Sandwich", icon: "food-sandwich" },
                { name: "Pasta", icon: "food-pasta" },
                { name: "Curry", icon: "food-curry" },
                { name: "Steak", icon: "food-steak" },
                { name: "Soup", icon: "food-soup" },
                { name: "BBQ", icon: "food-bbq" }
            ];

            let pendingLunch = null;
            const svgNamespace = 'http://www.w3.org/2000/svg';
            
            // Function to generate random lunch
            function generateRandomLunch() {
                // Only the latest click may finish. Old timers must not show stale results.
                clearTimeout(pendingLunch);
                // Remove fade-in class if it exists
                lunchDisplay.classList.remove('fade-in');
                
                // Get a random lunch option
                const randomIndex = Math.floor(Math.random() * lunchMenu.length);
                const selectedLunch = lunchMenu[randomIndex];
                
                // Briefly show loading state
                const spinner = document.createElement('span');
                spinner.className = 'loading-spinner';
                foodIcon.replaceChildren(spinner);
                foodName.textContent = "Thinking...";
                lunchDisplay.setAttribute('aria-busy', 'true');
                
                // After a short delay, show the selected lunch
                pendingLunch = setTimeout(() => {
                    const icon = document.createElementNS(svgNamespace, 'svg');
                    const use = document.createElementNS(svgNamespace, 'use');
                    icon.setAttribute('viewBox', '0 0 80 80');
                    use.setAttribute('href', `#${selectedLunch.icon}`);
                    icon.append(use);
                    foodIcon.replaceChildren(icon);
                    foodName.textContent = selectedLunch.name;
                    lunchDisplay.setAttribute('aria-busy', 'false');
                    pendingLunch = null;
                    
                    // Add animation class
                    lunchDisplay.classList.add('fade-in');
                }, 500);
            }
            
            // Add click event to button
            generateBtn.addEventListener('click', generateRandomLunch);
            
            // Generate a random lunch on page load
            generateRandomLunch();
        });
    </script>
</body>
</html>
